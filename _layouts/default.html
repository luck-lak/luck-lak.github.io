<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if page.description %}
    <meta name="description" content="{{ page.description | escape }}">
    {% endif %}
    <title>{% if page.title %}{{ page.title }} | Aokun Lei{% else %}Aokun Lei{% endif %}</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <script src="/js/main.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <header>
        <a class="site-title" href="/">AOKUN</a>
        <nav class="main-navigation">
            <a href="/">Home</a>
            <a href="/#projects">Projects</a>
            <a href="/#technical-journey">Technical Journey</a>
            <a href="/learning-records.html">Learning Records</a>
            <a href="/blog/"{% if page.url == '/blog/' or page.layout == 'post' %} class="active"{% endif %}>Blog</a>
        </nav>

        <button class="theme-button" type="button">
            🌙
        </button>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>
            © 2026 AOKUN LEI
        </p>
    </footer>
</body>

</html>
